<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새록새록 폰트 비교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Hahmlet:wght@300;400;500&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Gothic&family=Gaegu:wght@400;700&family=Noto+Serif+KR:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --ink:#ece8f6; --ink2:#b3b0cc; --ink3:#75739a; --gold:#ffd98a; --warm:#ffe9cf; --lav:#b9b7ff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 24px 40px; color: var(--ink); background: radial-gradient(130% 70% at 50% 0%, #1b2152 0%, #0b1026 55%, #070b1d 100%) fixed #070b1d; font-family: 'Pretendard Variable', -apple-system, sans-serif; }
  h1 { margin: 0 0 4px; font-weight: 500; font-size: 20px; }
  .lead { margin: 0 0 24px; color: var(--ink3); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .card { border-radius: 22px; padding: 18px 18px 20px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.07); font-family: var(--sans); }
  .card.now { border-style: dashed; }
  .tag { display: flex; justify-content: space-between; align-items: baseline; font-family: 'Pretendard Variable', sans-serif; font-size: 12px; color: var(--gold); letter-spacing: .02em; }
  .tag span { color: var(--ink3); }
  .brand { margin-top: 14px; display: flex; align-items: center; gap: 6px; font-family: var(--serif); font-size: 17px; letter-spacing: .04em; }
  .brand img { width: 20px; height: 24px; }
  .head { margin: 16px 0 2px; font-family: var(--serif); font-size: 24px; }
  .date { color: var(--ink3); font-size: 13px; }
  blockquote { margin: 14px 0 4px; font-family: var(--serif); font-size: 21px; line-height: 1.6; word-break: keep-all; color: var(--warm); }
  .who { font-size: 12px; color: var(--ink3); }
  .chips { margin-top: 14px; display: flex; gap: 6px; }
  .chip { flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,0.05); text-align: center; }
  .chip b { display: block; font-weight: 400; font-family: var(--serif); font-size: 15px; }
  .chip small { font-size: 10.5px; color: var(--ink3); }
  .chip.on { background: rgba(255,217,138,0.12); color: var(--gold); }
  .row { margin-top: 14px; display: flex; gap: 10px; font-size: 13px; color: var(--ink2); line-height: 1.55; }
  .row time { color: var(--ink3); flex: none; }
  .row .txt { font-family: var(--serif); font-size: 15px; color: var(--ink); }
  .note { margin-top: 12px; font-size: 13px; color: var(--ink2); line-height: 1.6; }
  .why { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.07); font-family: 'Pretendard Variable', sans-serif; font-size: 12px; color: var(--ink3); line-height: 1.6; }
</style>
</head>
<body>
  <h1>새록새록 폰트 비교</h1>
  <p class="lead">위쪽 글씨(제목·아이의 말)와 아래쪽 글씨(설명·버튼) 조합이에요. 점선 카드는 지금 쓰는 폰트예요.</p>
  <div class="grid" id="grid"></div>
<script>
const sets = [
  { key: '현재', name: '고운바탕 + 고운돋움', serif: "'Gowun Batang'", sans: "'Gowun Dodum'", why: '부드럽고 따뜻하지만 굵기가 하나뿐이라 화면 위계가 약해요.', now: true },
  { key: '1', name: '마루부리 + 프리텐다드', serif: "'MaruBuri'", sans: "'Pretendard Variable'", why: '네이버 마루부리. 획이 가늘고 단정해서 밤하늘처럼 고요해요. 본문은 가장 많이 쓰이는 프리텐다드라 읽기 편해요. 추천.' },
  { key: '2', name: '함렛 + 프리텐다드', serif: "'Hahmlet'", sans: "'Pretendard Variable'", why: '현대적인 세리프. 영문과 숫자가 특히 예쁘고 굵기 조절이 자유로워요.' },
  { key: '3', name: '나눔명조 + 나눔고딕', serif: "'Nanum Myeongjo'", sans: "'Nanum Gothic'", why: '동화책 같은 클래식한 느낌. 오래 검증된 조합이라 어느 기기에서나 안정적이에요.' },
  { key: '4', name: '개구 손글씨 + 프리텐다드', serif: "'Gaegu'", sans: "'Pretendard Variable'", why: '아이의 말만 손글씨로. 귀엽고 일기장 같지만, 긴 문장이나 영어는 조금 덜 정돈돼 보여요.' },
  { key: '5', name: '본명조 + IBM Plex 한글', serif: "'Noto Serif KR'", sans: "'IBM Plex Sans KR'", why: '가장 단단하고 반듯한 조합. 한글·영어·숫자 모양이 고르게 맞아요.' },
];
const grid = document.getElementById('grid');
for (const s of sets) {
  const el = document.createElement('section');
  el.className = 'card' + (s.now ? ' now' : '');
  el.style.setProperty('--serif', s.serif + ', serif');
  el.style.setProperty('--sans', s.sans + ', -apple-system, sans-serif');
  el.innerHTML = `
    <div class="tag">${s.now ? '지금' : '후보 ' + s.key}<span>${s.name}</span></div>
    <div class="brand"><img src="../brand.svg" alt="">새록새록</div>
    <div class="head">오늘</div>
    <div class="date">2026년 10월 27일 화요일 · Tue, Oct 27</div>
    <blockquote>“엄마, 달님도 코 자? Good night, moon!”</blockquote>
    <div class="who">아빠가 띄운 별 · 34개월</div>
    <div class="chips">
      <div class="chip on"><b>피식</b><small>완전 빵 터졌어</small></div>
      <div class="chip"><b>뭉클</b><small>마음이 찡했어</small></div>
      <div class="chip"><b>평생기억</b><small>평생 잊지 않을게</small></div>
    </div>
    <div class="row"><time>10.21</time><span class="txt">공룡은 왜 ABC 몰라? 1, 2, 3!</span></div>
    <p class="note">기록은 이 기기에만 저장돼요. 가족과 함께 쓰려면 초대 링크를 보내 주세요.</p>
    <div class="why">${s.why}</div>`;
  grid.appendChild(el);
}
</script>
</body>
</html>
